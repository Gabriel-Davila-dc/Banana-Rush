<title>Colheita no Bananal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;600;700&display=swap">
<style>
/* Layout: placar em faixa acima, palco 3D no centro com barra de força, menu/loja sobreposto ao palco. Visual único (bananal de dia). */
:root{
  --leaf:#15301b;
  --panel:#0e2213;
  --panel-2:#1c3d23;
  --banana:#ffd23f;
  --ripe:#f4a91d;
  --cream:#f6f1d8;
  --muted:#a9c2a4;
  --danger:#ff7a59;
  --good:#6fdc6a;
  --umbigo:#d58ae0;
  --veil:rgba(6,16,8,.42);
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--leaf);color:var(--cream);height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--body);font-size:15px;padding:0}
.wrap{position:fixed;inset:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:6px 20px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,5vw,46px);margin:0;color:var(--banana);line-height:1;text-wrap:balance}
.sub{color:var(--muted);margin:0;font-size:14px}
.hud{position:absolute;z-index:3;top:max(10px,env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.grp{display:flex;gap:6px;min-width:0}
.bar.xp i{background:var(--good)}
.lvlbox{width:100%;background:var(--panel-2);border-radius:9px;padding:9px 11px;display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.lvlbox strong{font-size:15px;color:var(--cream)}
.lvlbox .bar{height:7px}
.cycle{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:4px 0 2px}
.cycle span{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--panel-2);color:var(--muted)}
.cycle span.on{background:var(--banana);color:var(--leaf)}
#labels .lbl.alvo{background:rgba(255,210,63,.95)!important;color:#1d2a12!important;padding:2px 8px;border-radius:999px;text-shadow:none}
.shop-sec{font-family:var(--display);font-size:15px;color:var(--banana);padding:6px 4px 0}
.up.lock{opacity:.55}
.buy.lockb{background:var(--panel);color:var(--muted);font-size:13px}
.stat{background:rgba(9,22,12,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(246,241,216,.12);border-radius:12px;padding:5px 11px 6px;display:flex;flex-direction:column;gap:0;min-width:0;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.stat .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:rgba(246,241,216,.65);font-weight:600}
.stat .v{font-family:var(--display);font-size:18px;text-shadow:0 1px 2px rgba(0,0,0,.35);font-variant-numeric:tabular-nums;color:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v.warn{color:var(--danger)}
.stat .v.money{color:var(--banana)}
.bar{height:7px;background:var(--leaf);border-radius:4px;overflow:hidden;margin-top:4px}
.stat .bar{height:4px;background:rgba(246,241,216,.15);margin-top:3px}
.stat.main{align-items:center;padding:6px 16px 7px}
.stat.main .v{font-size:23px;color:var(--banana)}
.bar i{display:block;height:100%;width:0;background:var(--banana);transition:width .25s}
.stage{position:absolute;inset:0;overflow:hidden;background:var(--panel);user-select:none;-webkit-user-select:none}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse 75% 70% at 50% 48%,transparent 62%,rgba(10,30,14,.32))}
canvas{display:block;width:100%;height:100%;touch-action:none;filter:saturate(1.12) contrast(1.06)}
#labels{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.lbl{position:absolute;left:0;top:0;pointer-events:none;white-space:nowrap;font-weight:700;font-size:13px;will-change:transform}
.lbl.kg{color:var(--cream);text-shadow:0 1px 3px #000c}
.lbl.hint{background:rgba(14,34,19,.9);color:var(--banana);padding:4px 10px;border-radius:8px;font-weight:600}
.lbl.float{font-family:var(--display);font-weight:400;font-size:24px;text-shadow:0 2px 0 #14301b,0 0 6px #14301b}
.lbl.tq{font-size:11.5px;padding:2px 8px;border-radius:999px;background:rgba(14,34,19,.82);letter-spacing:.03em}
.q-gordo{color:var(--good)}
.q-medio{color:var(--cream)}
.q-magro{color:var(--danger)}
.q-umbigo{color:var(--umbigo)}
.lbl.worker{font-size:12px;padding:2px 8px;border-radius:8px;background:rgba(246,241,216,.9);color:#15301b;font-weight:600}
.stam{position:absolute;z-index:3;left:max(10px,env(safe-area-inset-left,0px));top:calc(max(10px,env(safe-area-inset-top,0px)) + 58px);background:rgba(9,22,12,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:9px;padding:5px 9px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;pointer-events:none}
.stam i{display:block;width:90px;height:7px;border-radius:4px;background:var(--leaf);overflow:hidden}
.stam b{display:block;height:100%;width:100%;background:var(--good)}
.order{position:absolute;z-index:3;right:max(10px,env(safe-area-inset-right,0px));top:calc(max(10px,env(safe-area-inset-top,0px)) + 58px);max-width:min(330px,62%);background:rgba(9,22,12,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:9px;padding:6px 10px;font-size:12.5px;font-weight:600;color:var(--cream);pointer-events:none}
.order.done{color:var(--good)}
.toast{position:absolute;z-index:4;left:50%;top:calc(max(10px,env(safe-area-inset-top,0px)) + 64px);transform:translateX(-50%);background:var(--banana);color:var(--leaf);font-family:var(--display);font-size:18px;padding:8px 16px;border-radius:12px;box-shadow:0 4px 0 var(--ripe);pointer-events:none;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.toast{max-width:min(520px,calc(100vw - 32px));white-space:normal!important;text-align:center;font-size:16px;line-height:1.25}
.ach{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.ach span{font-size:12px;padding:4px 9px;border-radius:999px;background:var(--panel);color:var(--muted)}
.ach span.on{background:var(--banana);color:var(--leaf);font-weight:700}
.camBtn{position:absolute;z-index:3;left:12px;bottom:14px;font-family:var(--body);font-weight:700;font-size:12px;border:1px solid rgba(246,241,216,.12);border-radius:10px;padding:6px 10px;background:rgba(9,22,12,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:var(--cream);cursor:pointer}
.camBtn:hover{background:var(--panel-2)}
.camBtn:focus-visible{outline:3px solid var(--cream);outline-offset:2px}
.crosshair{position:absolute;z-index:3;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--cream);box-shadow:0 0 0 2px rgba(14,34,19,.6);pointer-events:none}
@media (pointer:coarse){.camBtn{left:auto;right:max(18px,env(safe-area-inset-right,0px));bottom:150px}}
.power{position:absolute;z-index:3;left:50%;bottom:18px;transform:translateX(-50%);width:min(320px,78%);background:rgba(14,34,19,.9);border-radius:12px;padding:8px 12px 7px;display:flex;flex-direction:column;gap:5px;align-items:center;pointer-events:none}
.power span{font-size:12px;font-weight:600;color:var(--cream);letter-spacing:.04em}
.ptrack{position:relative;width:100%;height:18px;border-radius:9px;background:linear-gradient(90deg,#7a2a1c,#c8402c 55%,#e0a030);overflow:hidden}
.pzone{position:absolute;top:0;bottom:0;background:var(--good);box-shadow:0 0 0 2px #fff8 inset}
.pneedle{position:absolute;top:-3px;bottom:-3px;width:5px;margin-left:-2px;background:var(--cream);border-radius:3px;box-shadow:0 0 6px #000}
.joy{position:absolute;z-index:3;left:max(18px,env(safe-area-inset-left,0px));bottom:18px;width:134px;height:134px;border-radius:50%;background:rgba(14,34,19,.45);border:2px solid rgba(246,241,216,.35);display:none;touch-action:none}
.knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:var(--cream);opacity:.85}
.actbtn{position:absolute;z-index:3;right:max(18px,env(safe-area-inset-right,0px));bottom:22px;width:115px;height:115px;border-radius:50%;border:0;background:var(--banana);color:var(--leaf);font-family:var(--display);font-size:22px;box-shadow:0 5px 0 var(--ripe);display:none;touch-action:none}
.actbtn.on{transform:translateY(3px);box-shadow:0 2px 0 var(--ripe)}
@media (pointer:coarse){.joy,.actbtn{display:block}.power{bottom:154px}}
.overlay{position:absolute;inset:0;display:flex;background:var(--veil);padding:16px;overflow:auto;z-index:5}
.card{margin:auto;max-width:540px;width:100%;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;background:rgba(9,22,12,.62);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(246,241,216,.12);border-radius:20px;padding:22px 20px 16px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.install{width:100%;display:flex;flex-direction:column;align-items:center;gap:6px;background:rgba(255,210,63,.1);border:1px solid rgba(255,210,63,.35);border-radius:14px;padding:12px 12px 10px}
.install strong{font-family:var(--display);font-weight:400;font-size:19px;color:var(--banana)}
.install span{font-size:13px;color:var(--cream);line-height:1.4}
.install .btn{margin-top:2px}
.more{width:100%;text-align:left;background:rgba(246,241,216,.05);border:1px solid rgba(246,241,216,.08);border-radius:12px;padding:8px 12px}
.more>summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--banana);list-style:none;display:flex;justify-content:space-between;align-items:center}
.more>summary::-webkit-details-marker{display:none}
.more>summary::after{content:"+";font-family:var(--display);font-size:18px;color:var(--muted)}
.more[open]>summary::after{content:"–"}
.more[open]>summary{margin-bottom:8px}
.more>*:not(summary){margin-top:6px}
.more .shop{background:none;padding:0}
.more .shop-head{display:none}
.card h2{font-family:var(--display);font-weight:400;font-size:clamp(26px,4.5vw,38px);margin:0;color:var(--banana);line-height:1.05;text-wrap:balance}
.card p{margin:0;line-height:1.5;color:var(--cream)}
.card .small{font-size:13px;color:var(--muted)}
.keys{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;font-size:14px;color:var(--cream)}
kbd{font-family:var(--body);font-weight:700;background:var(--cream);color:var(--leaf);border-radius:5px;padding:1px 7px;font-size:12px}
.tip{border-left:3px solid var(--banana);padding-left:8px;text-align:left}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:6px;width:100%}
.legend div{background:var(--panel);border-radius:9px;padding:7px 6px;display:flex;flex-direction:column;gap:1px;font-size:12.5px;color:var(--muted)}
.legend b{font-size:14px}
@media (max-width:520px){.legend{grid-template-columns:repeat(2,minmax(0,1fr))}}
.btn{font-family:var(--display);font-size:22px;background:var(--banana);color:var(--leaf);border:0;border-radius:12px;padding:10px 26px;cursor:pointer;box-shadow:0 4px 0 var(--ripe);margin-top:4px}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ripe)}
.link{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:4px}
.btn:focus-visible,.buy:focus-visible,.link:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
.result{font-family:var(--display);font-size:44px;color:var(--cream);line-height:1}
.statsrow{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;font-size:14px;color:var(--muted)}
.statsrow b{color:var(--cream)}
.shop{width:100%;background:var(--panel);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;text-align:left}
.shop-head{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 4px}
.shop-head span:first-child{font-family:var(--display);font-size:20px;color:var(--cream)}
.shop-head .money{font-family:var(--display);font-size:20px;color:var(--banana);font-variant-numeric:tabular-nums}
.up{display:flex;gap:10px;align-items:center;background:var(--panel-2);border-radius:9px;padding:8px 10px}
.up-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.up-txt strong{font-size:14px}
.up-txt span{font-size:12.5px;color:var(--muted);line-height:1.35}
.pips{letter-spacing:2px;color:var(--banana)!important;font-size:12px!important}
.buy{flex:none;min-width:86px;font-family:var(--display);font-size:16px;border:0;border-radius:9px;padding:8px 10px;background:var(--banana);color:var(--leaf);cursor:pointer}
.buy:disabled{background:var(--leaf);color:var(--muted);cursor:default}
@media (max-width:760px){.hud{gap:4px;flex-wrap:wrap;justify-content:center}.grp{gap:4px}.stat{padding:4px 8px 5px;border-radius:10px}.stat .k{font-size:8px;letter-spacing:.06em}.stat .v{font-size:13px;overflow:visible;text-overflow:clip}.stat.main{padding:4px 12px 5px}.stat.main .v{font-size:16px}.stat.opt{display:none}.stam,.order{top:calc(max(10px,env(safe-area-inset-top,0px)) + 92px)}.toast{top:calc(max(10px,env(safe-area-inset-top,0px)) + 96px)}}
@media (pointer:coarse){.card .keys{display:none}}
.foot{color:var(--muted);font-size:13px;margin:0;line-height:1.5}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
.rotate{position:fixed;inset:0;z-index:9999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;background:var(--leaf);color:#fff;text-align:center;font-family:var(--display);font-size:22px}
.rotate .ph{width:54px;height:92px;border:4px solid var(--banana);border-radius:12px;animation:rot 1.8s ease-in-out infinite}
.rotate small{font-family:system-ui,sans-serif;font-size:14px;opacity:.75}
@keyframes rot{0%,20%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}
@media (pointer:coarse) and (orientation:portrait){.rotate{display:flex}}
</style>

<div class="wrap">
  <h1 class="sr">Colheita no Bananal</h1>
  <div class="stage" id="stage">
    <canvas id="game" aria-label="Bananal em 3D com o colhedor, as bananeiras e o trator"></canvas>
    <div id="labels"></div>
    <div class="hud" aria-live="polite">
      <div class="grp">
        <div class="stat"><span class="k">Dia</span><span class="v" id="hDay">1</span></div>
        <div class="stat"><span class="k">Tempo</span><span class="v" id="hTime">2:00</span></div>
      </div>
      <div class="grp"><div class="stat main"><span class="k">Hoje · meta</span><span class="v" id="hKg">0 kg</span></div></div>
      <div class="grp">
        <div class="stat"><span class="k">Dinheiro</span><span class="v money" id="hMoney">R$ 0</span></div>
        <div class="stat"><span class="k">Carreta</span><span class="v" id="hCart">0 / 12 cachos</span><div class="bar"><i id="hBar"></i></div></div>
        <div class="stat opt"><span class="k">Colhedor</span><span class="v" id="hLvl">Nível 1</span><div class="bar xp"><i id="hXp"></i></div></div>
      </div>
    </div>
    <div class="stam" id="stam" hidden><span>Fôlego</span><i><b id="stamBar"></b></i></div>
    <div class="order" id="order" hidden></div>
    <div class="toast" id="toast" hidden></div>
    <div class="crosshair" id="crosshair" hidden></div>
    <button class="camBtn" id="camBtn">1ª pessoa (V)</button>
    <div class="power" id="power" hidden>
      <div class="ptrack"><div class="pzone" id="pzone"></div><div class="pneedle" id="pneedle"></div></div>
      <span>Solte na faixa verde</span>
    </div>
    <div class="joy" id="joy"><div class="knob" id="knob"></div></div>
    <button class="actbtn" id="actBtn" aria-label="Ação">Foice</button>
    <div class="overlay" id="overlay"><div class="card" id="card"><h2>Carregando o bananal…</h2></div></div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const canvas = $('game'), stage = $('stage'), card = $('card'), overlay = $('overlay'), labelsEl = $('labels');
if (!window.THREE){ card.innerHTML = '<h2>O 3D não carregou</h2><p>Verifique a internet e recarregue a página.</p>'; return; }
const V3 = THREE.Vector3;
const rnd = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const fmtR = v => 'R$ ' + Math.round(v).toLocaleString('pt-BR');
const coarse = matchMedia('(pointer:coarse)').matches;
// no celular o jogo é sempre na horizontal: trava a tela quando o navegador deixa e, se não deixar, pede para girar
if (coarse){
  const rd = document.createElement('div'); rd.className = 'rotate'; rd.innerHTML = '<div class="ph"></div>Gire o celular<small>Colheita no Bananal se joga na horizontal</small>'; document.body.appendChild(rd);
}
function lockLandscape(){
  if (!coarse) return;
  const lock = () => { try{ const o = screen.orientation; if (o && o.lock) o.lock('landscape').catch(() => {}); }catch(e){} };
  try{
    const de = document.documentElement, fs = de.requestFullscreen || de.webkitRequestFullscreen;
    if (!document.fullscreenElement && !document.webkitFullscreenElement && fs && !matchMedia('(display-mode: standalone)').matches){ const r = fs.call(de, {navigationUI:'hide'}); if (r && r.then) r.then(lock, lock); else lock(); }
    else lock();
  }catch(e){ lock(); }
}
addEventListener('pointerdown', lockLandscape, {once:true});
// instalar como app: o navegador avisa quando dá para instalar; no iPhone só dá pelo menu Compartilhar
let installEvt = null;
const isInstalled = () => matchMedia('(display-mode: standalone), (display-mode: fullscreen), (display-mode: minimal-ui)').matches || navigator.standalone === true;
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const hasManifest = !!document.querySelector('link[rel="manifest"]');
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (typeof renderMenu === 'function' && !overlay.hidden) renderMenu(); });
window.addEventListener('appinstalled', () => { installEvt = null; if (typeof renderMenu === 'function' && !overlay.hidden) renderMenu(); });
const PRICE = 1.2;          // R$ por kg do cacho médio
const REGROW = 720; // um ciclo de 6 dias para a filha virar bananeira com cacho
// rede de estradas: linhas na direção x (estrada da frente e carreadores entre as fileiras) e duas na direção z
const HLINES = [{z:10, x0:-60, x1:82}, {z:-5.25, x0:-44, x1:44}, {z:-16.25, x0:-44, x1:44}, {z:-30, x0:-21.5, x1:22.5}, {z:-42.25, x0:-21.5, x1:22.5}];
const VLINES = [{x:-21.5, z0:-42.25, z1:10}, {x:22.5, z0:-42.25, z1:10}];
function onRoad(x, z, pad = 2){
  for (const l of HLINES) if (Math.abs(z - l.z) < pad && x > l.x0 - pad && x < l.x1 + pad) return true;
  for (const v of VLINES) if (Math.abs(x - v.x) < pad && z > v.z0 - pad && z < v.z1 + pad) return true;
  return false;
}       // segundos de colheita para a filha virar bananeira (15x mais lento que antes)

/* ---------- tipos de cacho ---------- */
const Q = {
  umbigo:{nome:'Com umbigo', curto:'Umbigo', mult:0,   hp:3},
  magro: {nome:'Magro',      curto:'Magro',  mult:.6,  hp:2, kg:[12,19]},
  medio: {nome:'Médio',      curto:'Médio',  mult:1,   hp:3, kg:[20,28]},
  gordo: {nome:'Gordo',      curto:'Gordo',  mult:1.6, hp:4, kg:[30,42]},
};
const RIPE = ['magro','medio','gordo'];
// variedades plantadas em SC: Nanica (Grande Naine, grupo Cavendish) no litoral norte; Prata Catarina (SCS451, da Epagri) no litoral sul
const VAR = {
  nanica:{nome:'Nanica', mult:1, kgK:1},
  prata:{nome:'Prata Catarina', mult:1.45, kgK:.68},
};
// talhão principal e do oeste: Nanica; talhões do leste e do fundo: Prata Catarina
const varietyAt = (x, z) => (x > 23.5 || z < -30) ? 'prata' : 'nanica';

/* ---------- texturas pintadas ---------- */
const ANISO = renderer.capabilities.getMaxAnisotropy();
function tex(w, h, draw, rep){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = ANISO;
  if (rep) t.repeat.set(rep[0], rep[1]);
  return t;
}
const pick = a => a[Math.random()*a.length|0];
function normalTex(w, h, draw, strength, rep){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.fillStyle = '#808080'; g.fillRect(0, 0, w, h); draw(g, w, h);
  const d = g.getImageData(0, 0, w, h).data, out = g.createImageData(w, h), o = out.data;
  const H = (x, y) => d[((((y + h)%h)*w) + ((x + w)%w))*4]/255;
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){
    let nx = (H(x - 1, y) - H(x + 1, y))*strength, ny = (H(x, y + 1) - H(x, y - 1))*strength, nz = 1;
    const l = Math.hypot(nx, ny, nz); nx /= l; ny /= l; nz /= l;
    const i = (y*w + x)*4; o[i] = (nx*.5 + .5)*255; o[i+1] = (ny*.5 + .5)*255; o[i+2] = (nz*.5 + .5)*255; o[i+3] = 255;
  }
  g.putImageData(out, 0, 0);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = ANISO;
  if (rep) t.repeat.set(rep[0], rep[1]);
  return t;
}
// cada textura de chão é pintada em duas telas: cor e altura (a altura vira mapa de relevo)
function groundMaps(S, Hh, paint){
  const c = document.createElement('canvas'), hc = document.createElement('canvas'); c.width = hc.width = S; c.height = hc.height = Hh;
  const g = c.getContext('2d'), h = hc.getContext('2d');
  paint(g, h, S, Hh);
  const map = new THREE.CanvasTexture(c); map.encoding = THREE.sRGBEncoding; map.wrapS = map.wrapT = THREE.RepeatWrapping; map.anisotropy = ANISO;
  const nrm = normalTex(S, Hh, gg => gg.drawImage(hc, 0, 0), 2.6);
  return {map, nrm};
}
// desenha repetindo nas bordas, para a textura emendar sem costura
function both(g, h, S, Hh, x, y, r, fn){
  for (const ox of [-S, 0, S]) for (const oy of [-Hh, 0, Hh]){
    const X = x + ox, Y = y + oy;
    if (X < -r || X > S + r || Y < -r || Y > Hh + r) continue;
    fn(g, X, Y, false); fn(h, X, Y, true);
  }
}
function paintSoil(g, h, S, Hh, base, cols){
  g.fillStyle = base; g.fillRect(0, 0, S, Hh); h.fillStyle = '#404040'; h.fillRect(0, 0, S, Hh);
  for (let i=0;i<S*Hh/900;i++){
    const x = rnd(0, S), y = rnd(0, Hh), r = rnd(4, 26), c = pick(cols);
    both(g, h, S, Hh, x, y, r, (q, X, Y, H) => { q.fillStyle = H ? 'rgba(90,90,90,.25)' : c; q.beginPath(); q.arc(X, Y, r, 0, 7); q.fill(); });
  }
  for (let i=0;i<S*Hh/50;i++){
    const x = rnd(0, S), y = rnd(0, Hh), r = rnd(.6, 2.2), l = rnd(60, 190)|0;
    g.fillStyle = pick(cols); g.fillRect(x, y, r, r); h.fillStyle = 'rgb(' + l + ',' + l + ',' + l + ')'; h.fillRect(x, y, r, r);
  }
  // torrões e pedrinhas com sombra
  for (let i=0;i<S*Hh/2600;i++){
    const x = rnd(0, S), y = rnd(0, Hh), r = rnd(1.5, 5), rot = rnd(0, 3), c = pick(['#6b5a46','#7d6a52','#5a4a3a','#8a7a66','#504236']);
    both(g, h, S, Hh, x, y, r + 4, (q, X, Y, H) => {
      if (!H){ q.fillStyle = 'rgba(0,0,0,.35)'; q.beginPath(); q.ellipse(X + 1.3, Y + 1.5, r, r*.75, rot, 0, 7); q.fill(); }
      q.fillStyle = H ? '#d0d0d0' : c; q.beginPath(); q.ellipse(X, Y, r, r*.75, rot, 0, 7); q.fill();
    });
  }
}
// tiras de folha seca de bananeira em camadas: as de baixo escuras e podres, as de cima claras e acinzentadas do sol
function paintLitter(g, h, S, Hh, n, sc){
  const DARK = ['#3b2f22','#45372a','#4a3a28','#3f3427','#52412c','#3a3024'];
  const MID = ['#6b5638','#76603e','#7d6a4a','#6a5a44','#83704f','#5e4a32','#6e5c46'];
  const TOP = ['#9a8460','#a8916a','#8f7c5c','#b09a72','#8a8070','#9d8f78','#a08458','#b5a586','#8c7a62'];
  const GREEN = ['#7a7d3a','#8a8a44','#6d7536','#93904c'];
  const seg = 10;
  for (let k=0;k<n;k++){
    const layer = k/n, big = Math.random() < .14;
    const len = rnd(.05, .2)*S*sc, wid = rnd(.007, .024)*S*sc*(big ? 2.2 : 1), a = rnd(0, 6.3);
    const col = layer > .85 && Math.random() < .05 ? pick(GREEN) : pick(layer < .35 ? DARK : layer < .75 ? MID : TOP);
    const bend = rnd(-.7, .7)*wid, top = [], bot = [];
    for (let i=0;i<=seg;i++){ const t = i/seg, tp = Math.min(1, Math.sin(Math.PI*t)*2 + .2); top.push(wid/2*tp*rnd(.7, 1.15)); bot.push(wid/2*tp*rnd(.7, 1.15)); }
    const veins = []; for (let v = -wid/2 + 1.2; v < wid/2; v += rnd(1.5, 3)) veins.push([v, Math.random()]);
    const spots = []; for (let i=0;i<(layer < .5 ? 3 : 1);i++) spots.push([rnd(-.4, .4)*len, rnd(-.3, .3)*wid, rnd(.1, .4)*wid + 2]);
    const hl = (55 + layer*180)|0, x = rnd(0, S), y = rnd(0, Hh);
    const path = q => {
      q.beginPath();
      for (let i=0;i<=seg;i++){ const t = i/seg, px = -len/2 + len*t, cy = bend*Math.sin(Math.PI*t); if (i) q.lineTo(px, cy - top[i]); else q.moveTo(px, cy - top[i]); }
      for (let i=seg;i>=0;i--){ const t = i/seg, px = -len/2 + len*t, cy = bend*Math.sin(Math.PI*t); q.lineTo(px, cy + bot[i]); }
      q.closePath();
    };
    const vein = (q, v) => { q.beginPath(); for (let i=0;i<=seg;i++){ const t = i/seg, px = -len/2 + len*t, cy = bend*Math.sin(Math.PI*t); if (i) q.lineTo(px, cy + v); else q.moveTo(px, cy + v); } q.stroke(); };
    both(g, h, S, Hh, x, y, len, (q, X, Y, H) => {
      q.save(); q.translate(X, Y); q.rotate(a); path(q);
      if (H){
        q.fillStyle = 'rgb(' + hl + ',' + hl + ',' + hl + ')'; q.fill(); q.clip();
        q.strokeStyle = 'rgba(255,255,255,.3)'; q.lineWidth = 1; for (const [v] of veins) vein(q, v);
        q.restore(); return;
      }
      q.save(); q.shadowColor = 'rgba(12,8,4,.6)'; q.shadowBlur = 3 + wid*.25; q.shadowOffsetX = 1.5; q.shadowOffsetY = 2; q.fillStyle = col; q.fill(); q.restore();
      q.clip();
      for (const [v, r] of veins){ q.strokeStyle = r < .5 ? 'rgba(30,20,10,.24)' : 'rgba(255,240,210,.13)'; q.lineWidth = r < .5 ? .9 : .7; vein(q, v); }
      for (const [sx, sy, sr] of spots){ q.fillStyle = 'rgba(40,28,16,.3)'; q.beginPath(); q.ellipse(sx, sy, sr*1.6, sr*.6, 0, 0, 7); q.fill(); }
      q.restore();
    });
  }
  // gravetos e pedaços de talo
  for (let k=0;k<n/14;k++){
    const x = rnd(0, S), y = rnd(0, Hh), a = rnd(0, 6.3), len = rnd(.03, .1)*S*sc, wd = rnd(1.5, 3.5)*sc, c = pick(['#5a4630','#6e5a40','#8a7656','#4a3a2a']);
    both(g, h, S, Hh, x, y, len, (q, X, Y, H) => {
      q.save(); q.translate(X, Y); q.rotate(a); q.lineCap = 'round';

function merge(list){
  const pos = [], nor = [], uv = [];
  for (const g of list){
    const n = g.index ? g.toNonIndexed() : g;
    const p = n.attributes.position.array, q = n.attributes.normal.array, u = n.attributes.uv ? n.attributes.uv.array : null;
    for (let i=0;i<p.length;i++){ pos.push(p[i]); nor.push(q[i]); }
    if (u) for (let i=0;i<u.length;i++) uv.push(u[i]); else for (let i=0;i<p.length/3*2;i++) uv.push(0);
  }
  const o = new THREE.BufferGeometry();
  o.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  o.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  o.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  return o;
}

function mergeKids(g){
  const by = new Map(), olds = [];

    if (!o.isMesh || o.isInstancedMesh || o.isSkinnedMesh || Array.isArray(o.material) || o.material.transparent) continue;
    o.updateMatrix(); if (o.matrix.determinant() < 0) continue;
    const k = o.material.uuid + '|' + (o.castShadow ? 1 : 0) + (o.receiveShadow ? 1 : 0);
    if (!by.has(k)) by.set(k, {o, list:[]});
    const geo = o.geometry.clone(); geo.applyMatrix4(o.matrix); by.get(k).list.push(geo); olds.push(o);
  }
  for (const b of by.values()){ if (b.list.length < 2) continue; const mm = new THREE.Mesh(merge(b.list), b.o.material); mm.castShadow = b.o.castShadow; mm.receiveShadow = b.o.receiveShadow; g.add(mm); }

}
function leafGeo(len, wid, rise = .55, droop = .95, seg = 18){
  const g = new THREE.PlaneGeometry(len, wid, seg, seg > 10 ? 5 : 2), p = g.attributes.position;
  for (let i=0;i<p.count;i++){
    const x = p.getX(i) + len/2, t = x/len, v = p.getY(i)/(wid/2);
    const bt = clamp((t - .09)/.91, 0, 1);
    // pecíolo fino, lâmina comprida quase do mesmo tamanho e ponta arredondada
    const shape = t < .09 ? .07 : Math.max(.07, Math.pow(Math.sin(Math.PI*Math.min(1, .05 + bt*.95)), .3));
    const a = Math.abs(v)*shape;
    const h = t*len*rise - t*t*len*droop;
    // asa de gaivota: sobe perto da nervura e a borda cai
    const fold = a*wid*.05 - a*a*wid*.32*bt;
    const ripple = Math.sin(t*46 + v*2)*.022*a*wid;
    p.setXYZ(i, x, h + fold + ripple, v*wid/2*shape);

// cobra ou abelha pega um ajudante/trabalhador: fica tonto e derruba o cacho que carrega
function npcStung(n, kind){

function snakeBite(){

function updateSnakes(dt){
  for (const sn of snakes){
    if (game.running){
      sn.cool -= dt;
      sn.turn = clamp(sn.turn + rnd(-1, 1)*dt*2, -.8, .8); sn.dir += sn.turn*dt;
      const r = sn.rect;
      if (sn.x < r[0] || sn.x > r[1] || sn.z < r[2] || sn.z > r[3]) sn.dir = Math.atan2((r[2] + r[3])/2 - sn.z, (r[0] + r[1])/2 - sn.x);
      if (sn.cool > 0) sn.dir = angLerp(sn.dir, Math.atan2(sn.z - player.pos.z, sn.x - player.pos.x), Math.min(1, dt*4));
      const sp = sn.cool > 0 ? 2.2 : .9;
      sn.x += Math.cos(sn.dir)*sp*dt; sn.z += Math.sin(sn.dir)*sp*dt;
      if (Math.hypot(player.pos.x - sn.x, player.pos.z - sn.z) < .75 && sn.cool <= 0 && !(player.stunT > 0)){ sn.cool = 5; snakeBite(); }
      if (sn.cool <= 0) for (const n of [...helpers, ...workers]){ if (!(n.stunT > 0) && Math.hypot(n.pos.x - sn.x, n.pos.z - sn.z) < .75){ sn.cool = 5; npcStung(n, 'cobra'); break; } }
    }
    sn.ph += dt*(sn.cool > 0 ? 9 : 5);
    const fx = Math.cos(sn.dir), fz = Math.sin(sn.dir);
    sn.segs.forEach((m, i) => { const w = Math.sin(sn.ph - i*.7)*.14*Math.min(1, i/3), sx = sn.x - fx*i*.17 - fz*w, sz = sn.z - fz*i*.17 + fx*w; m.position.set(sx, heightAt(sx, sz) + .07, sz); });
    sn.segs[0].rotation.y = Math.atan2(fx, fz);
  }
}
const snakeNear = d => snakes.some(sn => Math.hypot(player.pos.x - sn.x, player.pos.z - sn.z) < d);

const monkey = {g:null, holder:null, lbl:null, state:'off', t:30, x:0, z:0, yaw:0, target:null, carry:null, ex:0, ez:0, wanderT:0};

function monkeyCarryShow(){

  if (monkey.carry){ const b = makeBunch(monkey.carry.q, monkey.carry.bruised, monkey.carry); b.rotation.z = Math.PI/2; b.scale.setScalar(.75); h.add(b); }

function resetMonkey(){

function updateMonkey(dt){
  const m = monkey;

  if (m.state === 'off'){
    m.g.visible = false; m.lbl.style.display = 'none';
    if (save.day < 2) return;
    m.t -= dt;
    if (m.t <= 0){
      const r = pick(fieldRects()), side = Math.random()*4|0;
      m.x = side === 0 ? r[0] - 3 : side === 1 ? r[1] + 3 : rnd(r[0], r[1]);
      m.z = side === 2 ? r[2] - 3 : side === 3 ? r[3] + 2 : rnd(r[2], r[3]);
      m.ex = m.x; m.ez = m.z; m.state = 'seek'; m.wanderT = 12; m.target = null; m.g.visible = true;
      if (Math.hypot(m.x - player.pos.x, m.z - player.pos.z) < 45) float('Um macaco apareceu!', headPos(), '#ffd23f');
      snd.monkey();
    }
    return;
  }
  let gx = m.ex, gz = m.ez, sp = m.state === 'leave' ? 4.5 : 3.4;
  if (m.state === 'seek'){
    if (!m.target || !ground_bunches.includes(m.target)){
      m.target = null; let bs = 1e9;
      for (const b of ground_bunches){ if (b.swarm) continue; const sc = Math.hypot(b.x - m.x, b.z - m.z) - bunchValue(b)/10; if (sc < bs){ bs = sc; m.target = b; } }
    }
    m.wanderT -= dt;
    if (m.target){
      gx = m.target.x; gz = m.target.z; sp = 3.5;
      if (Math.hypot(gx - m.x, gz - m.z) < .5){
        const b = m.target;
        m.carry = {kg:b.kg, q:b.q, bruised:b.bruised, wash:b.wash, bag:b.bag, gold:b.gold, v:b.v};
        removeGroundBunch(b); m.target = null; monkeyCarryShow(); m.state = 'flee';
        if (Math.hypot(m.x - player.pos.x, m.z - player.pos.z) < 35) float('O macaco pegou um cacho!', new V3(m.x, 1.6, m.z), '#ffb199');
      }
    } else if (m.wanderT <= 0) m.state = 'leave';
    else { gx = m.x + Math.sin(now*.7)*3; gz = m.z + Math.cos(now*.5)*3; sp = 2; }
  }
  // chegar perto espanta o macaco; se ele estiver com cacho, solta
  if (m.state !== 'leave' && Math.hypot(player.pos.x - m.x, player.pos.z - m.z) < 1.7){
    if (m.carry){ spawnGroundBunch(m.x, m.z, m.carry.kg, m.carry.q, m.carry.bruised, 1, 0, m.carry); m.carry = null; monkeyCarryShow(); }
    m.state = 'leave'; m.target = null; float('Xô, macaco!', headPos(), '#6fdc6a'); unlock('macaco'); sfx(700, 300, .2, 'square', .05);
  }
  const dx = gx - m.x, dz = gz - m.z, d = Math.hypot(dx, dz);
  if (d > .05){ m.x += dx/d*Math.min(d, sp*dt); m.z += dz/d*Math.min(d, sp*dt); m.yaw = angLerp(m.yaw, Math.atan2(dx, dz), Math.min(1, dt*10)); }
  if ((m.state === 'flee' || m.state === 'leave') && d < .3){
    if (m.carry && Math.hypot(m.x - player.pos.x, m.z - player.pos.z) < 50) float('O macaco fugiu com um cacho!', headPos(), '#ff7a59');
    m.carry = null; monkeyCarryShow(); m.state = 'off'; m.t = rnd(35, 60); return;
  }
  m.g.position.set(m.x, heightAt(m.x, m.z) + (d > .05 ? Math.abs(Math.sin(now*11))*.22 : 0), m.z); m.g.rotation.y = m.yaw;
  if (Math.hypot(m.x - player.pos.x, m.z - player.pos.z) < 26){ m.lbl.textContent = m.carry ? 'Macaco com cacho! Pega ele' : 'Macaco ladrão'; placeLabel(m.lbl, m.x, 1.6, m.z); }
  else m.lbl.style.display = 'none';
}

function addLitter(x, z){
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();

}

function updateAmbience(){

  for (const T of allTractors()){ const d = Math.hypot(T.x - player.pos.x, T.z - player.pos.z); if (d < bd){ bd = d; best = T; } }

function nearCartT(){
  for (const T of allTractors()) if (cartDist(T, player.pos) < (T.state === 'moving' ? 2.1 : 1.5)) return T;
  return null;
}
// distância até a borda da carreta (não até o meio): vale para trás, lados e frente
function cartDist(T, p){
  return withTractor(T, () => {
    const ax = tractorAxisX(tractor.yaw), az = tractorAxisZ(tractor.yaw);
    const dx = p.x - tractor.x, dz = p.z - tractor.z, lx = dx*ax.x + dz*ax.z, lz = dx*az.x + dz*az.z;
    const ex = Math.max(-tractor.cartBack - lx, 0, lx + 2.6), ez = Math.max(Math.abs(lz) - tractor.cartHalfW, 0);
    return Math.hypot(ex, ez);
  });
}
function nearestBunch(){

function nearestTree(){

function nearestManejo(){

}
function ctxAction(){

function pushOut(p){
  for (const t of trees){
    if (t.state === 'falling' || (t.state === 'regrow' && t.grow < .5)) continue;
    const dx = p.x - t.x, dz = p.z - t.z, d = Math.hypot(dx, dz), r = .6;
    if (d < r && d > 1e-4){ p.x = t.x + dx/d*r; p.z = t.z + dz/d*r; }
  }
  for (const T of allTractors()) withTractor(T, () => {
    const ax = tractorAxisX(tractor.yaw), az = tractorAxisZ(tractor.yaw);
    const dx = p.x - tractor.x, dz = p.z - tractor.z;
    let lx = dx*ax.x + dz*ax.z, lz = dx*az.x + dz*az.z;
    const B = tractor.cartBack, HW = tractor.cartHalfW;
    if (lx > -B && lx < 2.1 && lz > -HW && lz < HW){
      const o = [[lx + B, 'x', -B], [2.1 - lx, 'x', 2.1], [lz + HW, 'z', -HW], [HW - lz, 'z', HW]].sort((a, b) => a[0] - b[0])[0];
      if (o[1] === 'x') lx = o[2]; else lz = o[2];
      p.x = tractor.x + ax.x*lx + az.x*lz; p.z = tractor.z + ax.z*lx + az.z*lz;
    }
  });
  const gate = Math.abs(p.x - .2) < 1.1;
  if (p.z <= 13.4){
    p.x = clamp(p.x, save.lv.terra >= 2 ? -46.5 : -21.5, save.lv.terra >= 1 ? 46.5 : 21.5);
    p.z = Math.max(p.z, save.lv.terra >= 3 ? -53 : -28.5);
    if (p.z > 12.9 && !gate) p.z = 12.9;
  } else {
    if (p.z < 13.9 && !gate) p.z = 13.9;
    p.x = clamp(p.x, -16.7, 17.2); p.z = Math.min(p.z, 27.8);
    if (typeof farmSolids === 'function') farmSolids(p);
  }
}

  if (fp){
    const fwd = -mz, str = mx, sy = Math.sin(fpYaw), cy = Math.cos(fpYaw);
    mx = sy*fwd - cy*str; mz = cy*fwd + sy*str;
  }
  const ml = Math.hypot(mx, mz);
  if (ml > 1){ mx /= ml; mz /= ml; }
  const carried = p.carry.reduce((s, c) => s + c.kg, 0);
  const mud = inMud(p.pos);
  // correr gasta fôlego; cansou, só volta a correr depois de recuperar um pouco
  const wantRun = (keys.run || Math.hypot(joy.x, joy.y) > .95) && ml > .1;
  if (p.stam === undefined) p.stam = 1;
  let running = false;
  if (wantRun && !p.tired && p.stam > 0){ running = true; p.stam = Math.max(0, p.stam - dt/(3.5*(plLevel() >= 5 ? 1.5 : 1))); if (p.stam <= 0) p.tired = true; }
  else { p.stam = Math.min(1, p.stam + dt/5); if (p.stam > .35) p.tired = false; }
  const speed = 3.4*(1 + .1*save.lv.botina)*(1 + Math.min(.15, .015*(plLevel() - 1)))*Math.max(.45, 1 - carried/110)*(mud ? .5 : 1)*(running ? 1.45 : 1);
  p.running = running && ml > .1;
  if (mud && ml > .1 && Math.random() < dt*10) spawnPart(M.dust, chipGeo, new V3(p.pos.x, .1, p.pos.z), new V3(rnd(-1, 1), rnd(1, 2.5), rnd(-1, 1)), .5);
  if (p.running && !mud && Math.random() < dt*9) spawnPart(M.dustPuff, smokeGeo, new V3(p.pos.x + rnd(-.2, .2), heightAt(p.pos.x, p.pos.z) + .1, p.pos.z + rnd(-.2, .2)), new V3(rnd(-.4, .4), rnd(.3, .8), rnd(-.4, .4)), .9);
  p.moving = ml > .1;
  if (p.moving){
    p.pos.x += mx*speed*dt; p.pos.z += mz*speed*dt;
    p.yaw = angLerp(p.yaw, Math.atan2(mx, mz), Math.min(1, dt*12));
    p.walk += dt*speed*2.2;
    const stepN = Math.floor(p.walk/Math.PI); if (stepN !== p.stepN){ p.stepN = stepN; snd.step(mud); }
  }
  pushOut(p.pos);
  if (charge.active && charge.tree){
    p.yaw = angLerp(p.yaw, Math.atan2(charge.tree.x - p.pos.x, charge.tree.z - p.pos.z), Math.min(1, dt*14));
    if (charge.tree.state !== 'grown' || Math.hypot(charge.tree.x - p.pos.x, charge.tree.z - p.pos.z) > 2.4){ charge.active = false; $('power').hidden = true; }
  }

  if (charge.active){
    charge.t += dt;
    const ph = (charge.t*(1.05 + .04*save.day)*2) % 2;
    charge.v = 1 - Math.abs(ph - 1);
    $('pneedle').style.left = (charge.v*100) + '%';
  }
  charge.cv += ((charge.active ? 1 : 0) - charge.cv)*Math.min(1, dt*10);

  if (swing.active){
    swing.t += dt;
    if (!swing.applied && swing.t >= .1){ swing.applied = true; if (swing.hit) applyHit(swing.hit); }
    if (swing.t > .5) swing.active = false;
  }

  // animação do colhedor
  syncCarry();
  if (fp) p.yaw = fpYaw;
  p.grp.position.copy(p.pos); p.grp.rotation.y = p.yaw;
  p.grp.visible = !fp;
  p.grp.rotation.z = p.stunT > 0 ? Math.sin(now*12)*.18 : 0;
  const st = p.moving ? Math.sin(p.walk) : 0;
  walkPose(P, st, {moving:p.moving, walk:p.walk, running:p.running, stun:p.stunT > 0,
    crouch:p.crouchT > 0 ? Math.sin(Math.PI*(1 - p.crouchT/.4)) : 0,
    twist:(swing.active || charge.active) ? -.25*charge.cv : 0});
  p.grp.position.y = heightAt(p.pos.x, p.pos.z) + (p.moving ? Math.abs(Math.cos(p.walk))*.05 : 0);
  const carrying = p.carry.length > 0;
  P.armL.rotation.x = carrying ? -2.6 : -st*.5;
  p.carryMeshes.forEach((m, i) => { if (p.carry[i]) m.scale.setScalar(.85); });
  let rx, ry;
  // foice de bananal: estica para frente e para cima, engancha no tronco e puxa para baixo
  let pz = .03;
  if (swing.active){
    const k = swing.t < .2 ? swing.t/.2 : 1, back = swing.t > .2 ? Math.min(1, (swing.t - .2)/.3) : 0;
    const e = 1 - Math.pow(1 - k, 3);
    rx = (-.7 + 1.85*e)*(1 - back) + .75*back; ry = .05*(1 - back) + .35*back; pz = .03 - .2*e*(1 - back);
  } else {
    rx = .75 + (-.7 - .75)*charge.cv; ry = .35 + (.05 - .35)*charge.cv; pz = .03 + .1*charge.cv;
  }
  M.trail.opacity = 0;
  P.piv.position.z = pz;
  if (carrying && !swing.active && !charge.active){ rx = 1.15; ry = .2; }
  P.piv.rotation.x = rx; P.piv.rotation.y = ry;
  fpRig.visible = fp;
  if (fp){
    const holding = carrying && !swing.active && !charge.active;
    fpPiv.visible = !holding;
    if (swing.active){ const k = Math.min(1, swing.t/.2), back = swing.t > .2 ? Math.min(1, (swing.t - .2)/.3) : 0, e = 1 - Math.pow(1 - k, 3); fpPiv.rotation.y = .05; fpPiv.rotation.x = (.85 - 1.5*e)*(1 - back) + .2*back; fpPiv.position.z = -.5 + .18*e*(1 - back); }
    else { fpPiv.rotation.y = .1 - .05*charge.cv; fpPiv.rotation.x = .2 + .65*charge.cv + (p.moving ? Math.sin(p.walk)*.04 : 0); fpPiv.position.z = -.5 - .08*charge.cv; }
    const sig = p.carry.map(c => c.q + (c.gold ? 'g' : '') + (c.bag ? 's' : '')).join(',');
    if (sig !== fpCarrySig){
      fpCarrySig = sig; while (fpCarry.children.length) fpCarry.remove(fpCarry.children[0]);
      if (p.carry[0]){ const c = p.carry[0], b = makeBunch(c.q, c.bruised, c); b.rotation.z = Math.PI/2; b.position.x = .25; fpCarry.add(b); }
    }
    fpCarry.visible = holding;
  }

  // bananeiras
  for (const t of trees){
    const dz = t.z - p.pos.z, dx = Math.abs(t.x - p.pos.x);
    t.crown.material = t.sig ? M.leafSig : t.leafMat;
    const lk = season().grow*(t.sig ? .85 : 1)/(1 + .3*t.lad);
    if (live && t.state !== 'falling'){
    }
    if (t.state === 'grown'){
      t.shake = Math.max(0, t.shake - dt*3);
      const gs = GUST.value*(t.esc ? .35 : 1);
      t.grp.rotation.set(Math.sin(now*40)*t.shake*.04 + gs*galeDir.z*(.05 + .04*Math.sin(now*3.1 + t.z)), 0, Math.sin(now*1.1 + t.x)*(.012 + .05*gs) + Math.cos(now*45)*t.shake*.04 - gs*galeDir.x*(.05 + .04*Math.sin(now*2.7 + t.x)));
      if (false){
        if (t.matureT <= 0){
          { const d = t.desu; setQuality(t, pickRipe(t, -.07*t.lad - (t.sig ? .08 : 0) + (d ? .25 : 0))); if (d){ t.desu = true; refreshBunch(t); } }
          if (Math.hypot(t.x - p.pos.x, t.z - p.pos.z) < 12) float('Engordou! ' + Q[t.q].nome, new V3(t.x, 2.8, t.z), '#6fdc6a');
        }
      }
    } else if (t.state === 'falling'){
      t.fallT += dt;
      const k = Math.min(1, t.fallT/.9);
      let fa = (Math.PI/2 - .08)*k*k;
      if (t.fallT > .9){ const u = t.fallT - .9; fa -= .09*Math.exp(-u*5)*Math.abs(Math.sin(u*15)); } // quica no chão
      t.grp.quaternion.setFromAxisAngle(t.axis, fa);
      if (k >= 1 && !t.dropped){
        if (Math.hypot(t.x - p.pos.x, t.z - p.pos.z) < 20) shake(.14);
        burstFlakes(new V3(t.x + t.dir.x*2.3, .6, t.z + t.dir.z*2.3), 14);
        t.dropped = true;
        if (t.bunch){ t.body.remove(t.bunch); t.bunch = null; }
        const tomb = !!t.tomb && !t.bag; t.tomb = false;
        const gkg = tomb ? Math.max(1, Math.round(t.kg*.85)) : t.kg; if (tomb) game.lost += t.kg - gkg;
        const gb = spawnGroundBunch(clamp(t.x + t.dir.x*2.9, -46, 46), clamp(t.z + t.dir.z*2.9, -52.5, 12.5), gkg, t.q, tomb, 1.0, 0, t);
        if (t.swarm){
          const sw = t.swarm; t.swarm = null; t.bees = false;
          sw.t = null; sw.gb = gb; gb.swarm = sw; sw.state = 'ground'; sw.time = 5;
        }
        if (t.harvester){
          const hh = t.harvester; t.harvester = null;
          const carriers = helpers.filter(x => !x.d.cut);
          if (hh.state === 'waitFall'){
            if (carriers.length && !tractor2){ hh.state = 'idle'; hh.idleT = .3; }   // carregadores levam; o cortador segue cortando
            else { gb.claimedBy = hh; hh.bunch = gb; helperGoTo(hh, gb.x, gb.z, .5); hh.state = 'toBunch'; }
          }
        }
        burst(new V3(t.x + t.dir.x*1.6, .2, t.z + t.dir.z*1.6), 14, [M.dust, M.chipB], 3, 4);
        if (Math.hypot(t.x - p.pos.x, t.z - p.pos.z) < 16) sfx(90, 40, .25, 'sine', .3);
      }
      if (t.fallT > 1.6) t.grp.position.y -= dt*1.6;
      if (t.fallT > 2.4) startRegrow(t, 0);
    } else if (t.state === 'regrow'){
      t.grow += live*lk/REGROW;
      t.grp.scale.setScalar(.15 + .85*Math.min(1, t.grow));
      if (t.grow >= .45 && t.mae.visible){ t.mae.visible = false; t.halves.visible = true; }
      if (t.grow >= 1) resetTree(t, 1); // cacho novo sempre nasce com umbigo
    }
  }

  updateWorkers(dt);
  updateHelpers(dt);
  updateSnakes(dt);
  updateSwarms(dt);
  for (const b of ground_bunches){
    if (b.y > .25 || b.vy !== 0){
      b.vy -= 18*dt; b.y += b.vy*dt;
      if (b.y <= .25){ b.y = .25; b.vy = b.vy < -3 ? -b.vy*.3 : 0; }
      b.holder.position.y = b.y + b.gy;
    }
    b.ring.scale.setScalar(1 + .06*Math.sin(now*5));
  }
  M.ring.opacity = .55 + .3*Math.sin(now*5);

  // tratores: o principal segue você; o segundo segue o Toninho
  for (const T of allTractors()){
    const cutter = helpers.find(h => h.d.cut);
    withTractor(T, () => updateTractor(dt, T === mainT || !cutter ? p.pos : cutter.pos, T === mainT));
  }

  for (const q of parts){
    if (!q.alive) continue;
    q.life -= dt;
    if (q.life <= 0){ q.alive = false; q.mesh.visible = false; continue; }
    if (q.smoke){ q.mesh.position.addScaledVector(q.vel, dt); q.mesh.scale.setScalar(1 + (1 - q.life/q.max)*1.4); }
    else {
      const fl = q.mesh.geometry === flakeGeo;
      q.vel.y -= (fl ? 3.2 : 14)*dt; if (fl){ q.vel.x *= .985; q.vel.z *= .985; }
      q.mesh.position.addScaledVector(q.vel, dt);
      const gq = heightAt(q.mesh.position.x, q.mesh.position.z) + .05;
      if (q.mesh.position.y < gq){ q.mesh.position.y = gq; q.vel.multiplyScalar(.4); q.vel.y *= -.3; }
      q.mesh.rotation.x += dt*8; q.mesh.rotation.z += dt*6;
    }
  }
  updateCritters(dt);
  updatePollen(dt); updateFarm(dt);
  updateSeason(dt);
  updateAmbience();
  if (game.running){ autoSaveT += dt; if (autoSaveT > 10){ autoSaveT = 0; saveField(); persist(); } }
  updateRain(dt);
  updateMonkey(dt);
  if (game.running && !game.rain && Math.random() < dt*.22) chirp();
  WIND.value = now; PLAYER_U.value.set(player.pos.x, 0, player.pos.z);
  for (const c of clouds){ c.position.x += c.userData.v*dt*(1 + gustV*5); if (c.position.x > 160) c.position.x = -160; }

  // câmera: baixa o bastante para mostrar o céu no alto da tela
  camTarget.lerp(p.pos, Math.min(1, dt*6));
  const far = (camera.aspect < 1.1 ? 1.3 : 1)*camZoom;
  const cgy = heightAt(camTarget.x, camTarget.z);
  camTargetY += (cgy - camTargetY)*Math.min(1, dt*4);
  if (fp){
    camera.position.set(p.pos.x, heightAt(p.pos.x, p.pos.z) + 1.62 + (p.moving ? Math.abs(Math.cos(p.walk))*.05 : 0), p.pos.z);
    camera.rotation.order = 'YXZ'; camera.rotation.set(fpPitch, fpYaw + Math.PI, p.stunT > 0 ? Math.sin(now*9)*.12 : 0);
  } else {
    camera.position.set(camTarget.x, camTargetY + 6.2*far, camTarget.z + 10*far);
    camera.lookAt(camTarget.x, camTargetY + 1.4, camTarget.z - 4);
  }
  $('crosshair').hidden = !(fp && game.running);
  if (shakeAmp > .002){ camera.position.x += rnd(-1, 1)*shakeAmp; camera.position.y += rnd(-1, 1)*shakeAmp*.7; shakeAmp *= Math.pow(.015, dt); } else shakeAmp = 0;
  sky.position.copy(camera.position);
  sun.position.set(camTarget.x + SUN_DIR.x*30, SUN_DIR.y*30, camTarget.z - 6 + SUN_DIR.z*30);
  sun.target.position.set(camTarget.x, 0, camTarget.z - 6);
}

/* ---------- rótulos e placar ---------- */
const hud = {lvl:$('hLvl'), xp:$('hXp'), day:$('hDay'), time:$('hTime'), kg:$('hKg'), money:$('hMoney'), cart:$('hCart'), bar:$('hBar')};
const fmtT = t => { const s = Math.ceil(t); return Math.floor(s/60) + ':' + String(s%60).padStart(2, '0'); };
const actBtn = $('actBtn');
function updateUI(dt){
  for (const b of ground_bunches) placeLabel(b.lbl, b.x, 1.0, b.z);
  for (const t of trees){
    const d = Math.hypot(t.x - player.pos.x, t.z - player.pos.z);
    const alvo = game.running && game.mis && misNeeds(game.mis.m.task, t);
    const grown = t.state === 'grown', near = alvo ? d < 13 : grown && d < 7;
    if (near){
      let txt = grown ? t.baseTxt : VAR[t.v].nome + ' · filha ' + Math.floor(t.grow*100) + '%';
      if (alvo) txt = '★ ' + game.mis.m.btn;
      if (t.lbl._t !== txt){ t.lbl._t = txt; t.lbl.textContent = txt; if (!grown) t.lbl.className = 'lbl tq'; t.lbl.classList.toggle('alvo', !!alvo); }
      placeLabel(t.lbl, t.x, grown ? 4.4 : 1.3 + 3*t.grow, t.z);
    } else t.lbl.style.display = 'none';
  }
  for (const h of helpers){
    if (game.running && (h.state !== 'idle' || h.stunT > 0) && Math.hypot(h.pos.x - player.pos.x, h.pos.z - player.pos.z) < 16){
      const stt = helperStatus(h);
      h.lbl.textContent = h.d.nome + (stt ? ' · ' + stt : '');
      placeLabel(h.lbl, h.pos.x, 2.15, h.pos.z);
    } else h.lbl.style.display = 'none';
  }
  for (const w of workers){
    if (game.running && Math.hypot(w.pos.x - player.pos.x, w.pos.z - player.pos.z) < 16){
      w.lbl.textContent = w.d.nome + (w.stunT > 0 ? ' · tonto' : w.state === 'work' ? ' · ' + w.d.verbo : '');
      placeLabel(w.lbl, w.pos.x, 2.15, w.pos.z);
    } else w.lbl.style.display = 'none';
  }
  for (const f of floats){ f.life -= dt; f.pos.y += dt*1.1; placeLabel(f.el, f.pos.x, f.pos.y, f.pos.z); f.el.style.opacity = Math.min(1, f.life*1.6); if (f.life <= 0) f.el.remove(); }
  for (let i=floats.length-1;i>=0;i--) if (floats[i].life <= 0) floats.splice(i, 1);

  let hint = null, btn = 'Foice';
  if (game.running && !charge.active){
    const a = ctxAction(), k = coarse ? 'Toque' : 'Espaço';
    if (a.type === 'deliver'){ hint = k + ': pôr na carreta'; btn = 'Entregar'; }
    else if (a.type === 'wait'){ hint = 'Trator descarregando…'; btn = 'Esperar'; }
    else if (a.type === 'pick' && a.b.swarm && a.b.swarm.state === 'ground'){ hint = 'Abelhas no cacho! Espere ' + Math.ceil(a.b.swarm.time) + ' s'; btn = 'Pegar'; }
    else if (a.type === 'pick'){ hint = k + ': pegar · ' + Q[a.b.q].curto + ' · ' + a.b.kg + ' kg'; btn = 'Pegar'; }
    else if (a.type === 'manejo'){ hint = k + ': ' + (a.t.lad ? 'desbaste (' + a.t.lad + (a.t.lad > 1 ? ' ladrões' : ' ladrão') + ')' : 'desfolha (folha seca)'); btn = 'Manejo'; }
    else if (a.type === 'aim'){ hint = fp ? 'Mire no cacho (bolinha no meio da tela) para ' + game.mis.m.fazer : 'Vire de frente para o cacho para ' + game.mis.m.fazer; btn = 'Mirar'; }
    else if (a.type === 'mis'){ hint = k + ': ' + game.mis.m.fazer + (game.mis.m.task === 'desbrotar' ? ' (' + a.t.lad + (a.t.lad > 1 ? ' ladrões)' : ' ladrão)') : ''); btn = game.mis.m.btn; }
    else if (a.type === 'notoday'){ hint = 'Hoje é ' + game.mis.m.nome.toLowerCase() + ', não de corte'; btn = game.mis.m.btn; }
    else if (a.type === 'umbigo'){ { const dd = Math.max(1, Math.round(a.t.matureT/dayLength())); hint = 'Com umbigo · pronto em ~' + dd + (dd > 1 ? ' dias' : ' dia'); } btn = 'Foice'; }
    else if (a.type === 'bees'){ hint = 'Abelhas no cacho! Corra e espere'; btn = 'Foice'; }
    else if (a.type === 'cut'){ hint = (coarse ? 'Segure' : 'Segure Espaço') + ' para cortar'; btn = 'Foice'; }
    else if (a.type === 'drop'){ hint = player.carry.length >= carryCap() ? 'Leve até a carreta do trator' : 'Carregando ' + player.carry.length + '/' + carryCap(); btn = 'Soltar'; }
  }
  if (game.running && player.stunT > 0) hint = 'Tonto! Espere passar…';
  else if (game.running && !charge.active && snakeNear(3.2)) hint = 'Cuidado: cobra!';
  if (hint){ hintEl.textContent = hint; hintEl.hidden = false; placeLabel(hintEl, player.pos.x, 2.5, player.pos.z); } else hintEl.hidden = true;
  if (actBtn.textContent !== btn) actBtn.textContent = btn;

  hud.day.textContent = save.day + ' · ' + season().nome;
  const semRelogio = game.running && game.mis && !game.mis.done;
  hud.time.textContent = semRelogio ? 'até terminar' : fmtT(game.t);
  hud.time.classList.toggle('warn', game.running && !semRelogio && game.t < 15);
  if (game.mis){ hud.kg.textContent = Math.min(game.mis.got, game.mis.goal) + ' / ' + game.mis.goal + ' ' + game.mis.m.feito; hud.kg.classList.toggle('money', game.mis.done); }
  else { hud.kg.textContent = game.kg + ' / ' + metaDay() + ' kg'; hud.kg.classList.toggle('money', game.kg >= metaDay()); }
  hud.money.textContent = fmtR(save.money);
  hud.lvl.textContent = 'Nível ' + plLevel();
  hud.xp.style.width = Math.round(xpFrac()*100) + '%';
  const away = tractor.state === 'leaving' || tractor.state === 'away' || tractor.state === 'returning';
  hud.cart.textContent = away ? 'descarregando' : tractor.state === 'moving' ? 'trator vindo' : tractor.cargo.length + ' / ' + cartCap() + ' cachos';
  hud.bar.style.width = Math.min(100, tractor.cargo.length/cartCap()*100) + '%';
  const stEl = $('stam'), sv = player.stam === undefined ? 1 : player.stam;
  stEl.hidden = !game.running || sv > .995;
  if (!stEl.hidden){ $('stamBar').style.width = (sv*100) + '%'; $('stamBar').style.background = player.tired ? 'var(--danger)' : 'var(--good)'; }
  const od = $('order'), o = game.order, ms = game.mis;
  od.hidden = !game.running || !(o || ms);
  if (ms && !od.hidden){ od.textContent = ms.done ? 'Missão cumprida! ' + ms.m.nome : ms.m.nome + ': ' + ms.got + '/' + ms.goal + ' ' + ms.m.feito + ' · ' + fmtR(ms.reward); od.classList.toggle('done', ms.done); }
  if (o && !ms && !od.hidden){ od.textContent = o.done ? 'Encomenda entregue!' : 'Encomenda: ' + o.got + '/' + o.n + ' ' + o.txt + ' · ' + fmtR(o.reward); od.classList.toggle('done', o.done); }
}

function updateFarm(dt){
  if (!FARM.animals.length) return;
  const near = Math.hypot(player.pos.x, player.pos.z - 20) < 55;
  if (player.pos.z > 13.6 && !FARM.entered){ FARM.entered = true; if (game.running) toast('Fazendinha: vacas, porcos, galinhas e a horta'); }
  if (player.pos.z < 12.5) FARM.entered = false;
  if (!near) return;
  for (const a of FARM.animals){
    a.ph += dt;
    const dx = a.tx - a.x, dz = a.tz - a.z, d = Math.hypot(dx, dz);
    if (a.wait > 0){
      a.wait -= dt;
      if (a.wait <= 0){ const p = a.pen; a.tx = rnd(p[0], p[1]); a.tz = rnd(p[2], p[3]); }
      const graze = a.kind === 'hen' ? (Math.sin(a.ph*7) > .3 ? .9 : 0) : a.kind === 'cow' ? .55 + Math.sin(a.ph*.8)*.1 : .4;
      a.head.rotation.x += (graze - a.head.rotation.x)*Math.min(1, dt*6);
      a.legs.forEach(l => { l.rotation.x *= .85; });
    } else if (d > .1){
      const sp = a.speed*(a.kind === 'hen' ? (Math.sin(a.ph*3) > 0 ? 1.6 : .5) : 1);
      a.x += dx/d*sp*dt; a.z += dz/d*sp*dt;
      a.yaw = angLerp(a.yaw, Math.atan2(dx, dz), Math.min(1, dt*3));
      const st = Math.sin(a.ph*(a.kind === 'hen' ? 18 : 5));
      a.legs.forEach((l, i) => { l.rotation.x = st*.45*((i === 0 || i === 3) ? 1 : -1); });
      a.head.rotation.x += (.05 - a.head.rotation.x)*Math.min(1, dt*4);
    } else a.wait = rnd(2, 7);
    if (a.tail) a.tail.rotation.z = Math.sin(a.ph*2.2)*.35;
    a.g.position.set(a.x, heightAt(a.x, a.z) + (a.kind === 'hen' && a.wait <= 0 ? Math.abs(Math.sin(a.ph*9))*.03 : 0), a.z);
    a.g.rotation.y = a.yaw;
  }
}
function farmSolids(p){
  const r = .35;
  for (const b of FARM.boxes){
    if (p.x > b[0] - r && p.x < b[1] + r && p.z > b[2] - r && p.z < b[3] + r){
      const o = [[p.x - (b[0] - r), 'x', b[0] - r], [(b[1] + r) - p.x, 'x', b[1] + r], [p.z - (b[2] - r), 'z', b[2] - r], [(b[3] + r) - p.z, 'z', b[3] + r]].sort((a, c) => a[0] - c[0])[0];
      p[o[1]] = o[2];
    }
  }
  for (const [cx, cz, cr] of FARM.circles){ const dx = p.x - cx, dz = p.z - cz, d = Math.hypot(dx, dz), rr = cr + r; if (d < rr && d > 1e-4){ p.x = cx + dx/d*rr; p.z = cz + dz/d*rr; } }
}

// detalhes pequenos (menos de 300 triângulos) não fazem sombra: a sombra fica quase igual e o jogo desenha bem menos

let perfAcc = 0, perfN = 0, quality = renderer.getPixelRatio();
function loop(ts){
  const raw = Math.max(0, (ts - last)/1000), dt = Math.min(.05, raw); last = ts;
  if (raw < .5){ perfAcc += raw; perfN++; }
